;place-items:center;font-size:40px;margin:0 auto 20px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;background:#fff;border-top:1px solid #edf0f4;display:flex;padding:8px 4px max(9px,env(safe-area-inset-bottom));box-shadow:0 -4px 16px #23344b08}.nav button{flex:1;background:none;border:0;padding:9px 0;color:#77869a;font-size:12px;cursor:pointer}.nav b{display:block;font-size:22px;font-weight:500;margin-bottom:3px}.nav button.active{color:#175ed4;font-weight:800}.muted{color:#7b8797}.pill{display:inline-block;border-radius:30px;background:#eaf2ff;color:#175ed4;font-size:12px;padding:7px 11px;font-weight:700}.fav{background:none;border:0;font-size:23px;color:#d49a20;cursor:pointer}.error{color:#c12d3a;font-size:13px;margin-top:9px;min-height:18px}.receipt{background:#f6f8fb;border-radius:18px;padding:18px;margin-top:20px}.readonly-name{padding:17px 15px;background:#f2f6fc;border-radius:13px;font-size:20px;font-weight:800}.spacer{height:16px}button:focus-visible{outline:3px solid #88b6ff;outline-offset:2px}@media(max-width:360px){.app{padding-left:15px;padding-right:15px}.bank-grid{gap:6px}.bank{font-size:11px}.amount-input{font-size:30px!important}}

const KEY='practice-bank-demo-v51';const banks=[['KB국민','KB','#ffdc45','#5a4700'],['신한','신한','#dfeeff','#1754ae'],['하나','하나','#d8f5ed','#0b806c'],['우리','우리','#e1efff','#1167c4'],['NH농협','NH','#e7f4d6','#3f7829'],['IBK기업','IBK','#e0ecff','#1d5aa5'],['카카오뱅크','K','#ffe868','#302800'],['토스뱅크','T','#e3ecff','#2963e4'],['SC제일','SC','#e3f7ef','#16805b'],['케이뱅크','K','#e4edff','#2758bc'],['부산','BNK','#e7f1ff','#1e59a0'],['대구','iM','#e8edff','#374bc5'],['광주','광주','#ffe8e8','#b43535'],['전북','전북','#e6f5f0','#247960'],['경남','BNK','#e6f0ff','#2863a9'],['우체국','우','#ffebe6','#c64c2b'],['새마을금고','MG','#e7f4e9','#287f46'],['신협','신협','#e8efff','#2c62b0'],['수협','수협','#e1f1ff','#2473b8'],['함께은행','함께','#e5efff','#1758c6']];
const empty=()=>({name:'',account:'',pin:'',cert:'',balance:0,transactions:[],recent:[],favorites:[],pinFails:0,certFails:0,pinLocked:false,certLocked:false,loggedIn:false});let state=empty(),page='start',signup={},draft={},tab='recent',bankPicker=false,errors='',historyFilter={period:'1',type:'all',order:'newest',from:'',to:'',min:'',max:'',keyword:''},historyPanel=false,balanceVisible=true,historyDraft=null,detailIndex=-1;const view=document.getElementById('view'),nav=document.getElementById('nav');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toLocaleString('ko-KR')+'원';const now=()=>new Date().toLocaleString('ko-KR');
try{const stored=JSON.parse(sessionStorage.getItem(KEY));if(stored)state={...empty(),...stored,loggedIn:false}}catch(e){};
function save(){try{sessionStorage.setItem(KEY,JSON.stringify({...state,loggedIn:false}))}catch(e){console.warn("임시 저장을 사용할 수 없어 현재 화면에서만 유지됩니다.",e)}}function button(label,action,cls=''){return `<button class="btn ${cls}" data-action="${esc(action)}">${label}</button>`}function head(title,back='home'){return `<div class="heading"><button class="back" data-action="go:${back}" aria-label="뒤로 가기">‹</button><h1>${title}</h1></div>`}function field(id,label,type='text',placeholder='',value=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}" ${type==='password'?'autocomplete="off" inputmode="numeric"':''}></div>`}function go(p){if(p==='history'&&page!=='history'&&page!=='transactionDetail'){historyFilter={period:'1',type:'all',order:'newest',from:'',to:'',min:'',max:'',keyword:''};historyPanel=false}if(p==='transfer'&&!page.startsWith('transfer')){draft={};tab='recent';bankPicker=false}if(!state.account&&!['start','open','openPin','openSimple','certCreate','existing'].includes(p))p='start';else if(state.account&&!state.loggedIn&&!['login','certCreate','start'].includes(p))p='login';page=p;errors='';render();window.scrollTo(0,0)}function err(s){errors=s;const e=document.getElementById('error');if(e)e.textContent=s;else alert(s)}function navRender(){nav.innerHTML=state.loggedIn?`<button data-action="go:home">⌂ 홈</button><button data-action="go:settings">⚙ 설정 · 로그아웃</button>`:''}
function bankLogo(name){const b=banks.find(x=>x[0]===name)||banks[0];return `<span class="bank-symbol" style="--bank-bg:${b[2]};--bank-fg:${b[3]}">${b[1]}</span>`}
function demoName(bank,account){const names=['김민준','이서연','박지훈','최하은','정도윤','강지우','윤서준','한수빈','오지호','신예린','임현우','조유진','장민서','서지안','송준혁','권채원'];let hash=17;for(const c of bank+':'+account)hash=(hash*31+c.charCodeAt(0))>>>0;return names[hash%names.length]}
function receiverVerified(){draft.name=draft.name||demoName(draft.bank,draft.receiver);draft.fromMemo=draft.name;draft.toMemo=state.name;go('transferAmount')}
function receiverList(items){return items.length?items.map((r,i)=>`<button class="account-row" data-action="pick:${esc(r.bank)}|${esc(r.account)}|${esc(r.name)}"><span style="display:flex;align-items:center;gap:12px">${bankLogo(r.bank)}<span><strong>${esc(r.name||'연습용 수취인')}</strong><small>${esc(r.bank)} · ${esc(r.account)}</small></span></span><span style="font-size:20px;color:#9ba6b5">›</span></button>`).join(''):`<div class="empty">아직 등록된 계좌가 없습니다.<br>직접입력에서 이체를 연습해 보세요.</div>`}
function render(){let h='';navRender();
if(page==='start')h=`<div class="spacer"></div><div class="welcome-mark">H</div><h1>함께은행 모바일뱅킹</h1><p class="sub">이체와 거래내역 조회를 안전하게 연습해 보세요.</p><div class="notice">교육용 가상은행입니다. 실제 금융기관의 계좌번호나 비밀번호를 입력하지 마세요.</div>${button(state.account?'로그인':'모바일뱅킹 시작하기',state.account?'go:login':'go:open')}`;
else if(page==='open')h=`${head('모바일뱅킹 시작하기','start')}<span class="pill">1 / 3 단계</span><h2>이름 입력</h2><p class="sub">실습에서 사용할 이름 또는 별명을 입력하세요.</p>${field('name','실습용 이름 또는 별명','text','예: 김교육',signup.name||'')}<div id="error" class="error"></div>${button('다음','signupName')}`;
else if(page==='openPin')h=`${head('계좌 비밀번호 설정','open')}<span class="pill">2 / 3 단계</span><h2>계좌 비밀번호</h2><p class="sub">이체할 때 사용할 연습용 숫자 4자리를 설정하세요.</p>${field('pin','계좌 비밀번호 (숫자 4자리)','password','숫자 4자리')}${field('pin2','계좌 비밀번호 확인','password','다시 입력')}<div id="error" class="error"></div>${button('다음','signupPin')}`;
else if(page==='openSimple')h=`${head('간편비밀번호 설정','openPin')}<span class="pill">3 / 3 단계</span><h2>간편비밀번호</h2><p class="sub">로그인할 때 사용할 연습용 숫자 6자리를 설정하세요.</p>${field('cert','간편비밀번호 (숫자 6자리)','password','숫자 6자리')}${field('cert2','간편비밀번호 확인','password','다시 입력')}<div class="notice">실제 금융기관에서 사용하는 비밀번호는 입력하지 마세요.</div><div id="error" class="error"></div>${button('모바일뱅킹 시작','createAccount')}`;
else if(page==='login')h=`${head('간편비밀번호 로그인','start')}<p class="sub">${esc(state.name)} 님의 연습용 인증서</p>${field('password','간편비밀번호','password','숫자 6자리')}<div id="error" class="error"></div>${button('로그인','login')}${state.certLocked?button('실습 데이터 초기화','resetAll','ghost'):''}`;
else if(page==='home')h=`<div class="spacer"></div><h1>${esc(state.name)} 님, 안녕하세요.</h1><div class="card"><strong>함께은행 입출금통장</strong><div class="account-tools"><span class="sub">${esc(state.account)}</span><button class="mini" data-action="copyAccount">▢ 복사</button></div><div class="balance-row"><div class="balance">${balanceVisible?money(state.balance):'•••••• 원'}</div><button class="mini" data-action="toggleBalance">${balanceVisible?'숨기기':'표시'}</button></div><div class="grid2">${button('이체','go:transfer')}${button('거래내역 조회','go:history','secondary')}</div></div>`;
else if(page==='balance')h=`${head('계좌조회')}<div class="card"><strong>함께은행 입출금통장</strong><div class="account-tools"><span class="sub">${esc(state.account)}</span><button class="mini" data-action="copyAccount">▢ 복사</button></div><div class="balance">${balanceVisible?money(state.balance):'•••••• 원'}</div></div>${button('입출금 거래내역','go:history','secondary')}${button('이체하기','go:transfer')}`;
else if(page==='history'){
 const f=historyDraft||historyFilter, today=localDate(new Date());

 const choices=(key,items)=>`<div class="choice-row">${items.map(([v,t])=>`<button class="choice ${f[key]===v?'chosen':''}" data-action="filter:${key}:${v}">${t}</button>`).join('')}</div>`;

 h=`${head('입출금 거래내역')}<div class="account-summary"><span>함께은행 입출금통장</span><strong>${esc(state.account)}</strong><div class="summary-balance">${money(state.balance)}</div></div><button class="filter-trigger" data-action="toggleHistory"><span>${periodLabel} · ${typeLabel} · ${orderLabel}</span><span>조회조건 ${historyPanel?'⌃':'⌄'}</span></button>${historyPanel?`<div class="history-sheet"><div class="sheet-title">조회조건 설정</div><div class="section-label">조회기간</div>${choices('period',[['1','1개월'],['3','3개월'],['6','6개월'],['custom','직접입력']])}<div class="grid2"><div class="field"><label>시작일</label><input id="historyFrom" type="date" value="${esc(dates.from)}" max="${today}"></div><div class="field"><label>종료일</label><input id="historyTo" type="date" value="${esc(dates.to)}" max="${today}"></div></div><div class="section-label">거래구분</div>${choices('type',[['all','전체'],['out','출금'],['in','입금']])}<div class="section-label">정렬순서</div>${choices('order',[['newest','최신순'],['oldest','과거순']])}<div class="section-label">거래금액 (원)</div><div class="grid2"><div class="field"><label>최소금액</label><input id="historyMin" inputmode="numeric" placeholder="0" value="${esc(f.min||'')}"></div><div class="field"><label>최대금액</label><input id="historyMax" inputmode="numeric" placeholder="제한 없음" value="${esc(f.max||'')}"></div></div><div class="field"><label for="historyKeyword">거래내용·상대방 검색</label><input id="historyKeyword" type="search" placeholder="예: 신한카드, 관리비, 김민준" value="${esc(f.keyword||'')}"></div><div id="error" class="error"></div>${button('조회하기','historySearch')}</div>`:''}<div id="historyResults"></div>`;
}
else if(page==='transfer'){
 h=`${head('받는 분 계좌')}<div class="tabs"><button class="tab ${tab==='recent'?'active':''}" data-action="tab:recent">최근</button><button class="tab ${tab==='favorite'?'active':''}" data-action="tab:favorite">자주</button><button class="tab ${tab==='direct'?'active':''}" data-action="tab:direct">직접입력</button></div>`;

function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function demoTransactions(){
 const today=new Date(),start=new Date(2026,0,1),end=today>=start?today:start;
 const items=[];
 const rules=[
 [2,9,10,'급여',1300000,'salary'],[4,12,5,'아파트 관리비',-215000,'variable'],
 [6,11,15,'편의점',-12500,'variable'],[8,13,20,'김민준',80000,'variable'],
 [10,10,30,'통신요금',-69000,'fixed'],[12,18,5,'마트 결제',-87300,'variable'],
 [14,9,25,'신한카드 결제대금',-645000,'card'],[16,12,15,'식당 결제',-38500,'variable'],
 [18,14,35,'생활비 입금',200000,'variable'],[20,10,45,'공과금',-54000,'variable'],
 [22,13,5,'카페 결제',-16500,'variable'],[24,11,10,'병원비',-48000,'variable'],
 [25,9,5,'급여 추가수당',150000,'variable'],[26,16,20,'삼성카드 결제대금',-328000,'card'],
 [27,13,35,'온라인 쇼핑',-74200,'variable'],[28,12,40,'박지훈',-100000,'variable']
 ];
 // Deterministic monthly variation: same entries for every learner, different amounts each month.
 function amountFor(base,kind,month,index){
  if(kind==='fixed')return base;
  const seed=((month+1)*7919+(index+3)*104729)>>>0;
  const factor=kind==='card' ? (72+(seed%67))/100 : kind==='salary' ? (95+(seed%11))/100 : (75+(seed%51))/100;
  return Math.round(base*factor/10)*10;
 }
 for(let y=2026;y<=end.getFullYear();y++)for(let mo=0;mo<12;mo++){
  if(y===end.getFullYear()&&mo>end.getMonth())break;
  rules.forEach(([day,hour,minute,label,base,kind],index)=>{
   if(day>new Date(y,mo+1,0).getDate())return;
   const d=new Date(y,mo,day,hour,minute);if(d>end)return;
   items.push({label,amount:amountFor(base,kind,(y-2026)*12+mo,index),date:d.toLocaleString('ko-KR'),timestamp:d.getTime(),memo:'교육용 가상 거래'});
  });
 }
 const total=items.reduce((sum,t)=>sum+t.amount,0);
 items.push({label:'가상 계좌 시작 잔액',amount:5000000-total,date:start.toLocaleString('ko-KR'),timestamp:start.getTime(),memo:'교육용 시작 잔액'});
 return items.sort((a,b)=>b.timestamp-a.timestamp);
}
function periodDates(period,from,to){const today=new Date(),end=localDate(today);if(period==='custom')return {from:from||end,to:to||end};const d=new Date(today.getFullYear(),today.getMonth(),today.getDate(),12);const originalDay=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-Number(period));const maxDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(originalDay,maxDay));return {from:localDate(d),to:end}}
function computeBalances(){const chronological=[...state.transactions].sort((a,b)=>a.timestamp-b.timestamp);let bal=state.balance-chronological.reduce((n,t)=>n+t.amount,0);for(const t of chronological){bal+=t.amount;t.afterBalance=bal}}
function renderHistoryResults(){const area=document.getElementById('historyResults');if(!area)return;computeBalances();const f=historyFilter,dates=periodDates(f.period,f.from,f.to);const min=Number(f.min||0),max=f.max===''?Infinity:Number(f.max);const filtered=state.transactions.map((t,i)=>({...t,_idx:i})).filter(t=>{const d=localDate(new Date(t.timestamp));return d>=dates.from&&d<=dates.to&&(f.type==='all'||(f.type==='in'?t.amount>0:t.amount<0))&&Math.abs(t.amount)>=min&&Math.abs(t.amount)<=max&&(!f.keyword||((t.label||'')+' '+(t.memo||'')).toLowerCase().includes(f.keyword.toLowerCase()))}).sort((a,b)=>f.order==='oldest'?a.timestamp-b.timestamp:b.timestamp-a.timestamp);let last='';area.innerHTML=`<div class="result-heading">거래내역 <strong>${filtered.length}건</strong></div>`+(filtered.length?filtered.map(t=>{const d=localDate(new Date(t.timestamp));const group=d!==last?`<div class="date-group">${d}</div>`:'';last=d;return group+`<button class="transaction-row transaction-button" data-action="detail:${t._idx}"><div><strong>${esc(t.label)}</strong><div class="sub">${new Date(t.timestamp).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} · ${t.amount>0?'입금':'출금'}</div></div><div class="transaction-right"><div class="transaction-amount ${t.amount>0?'deposit':'withdraw'}">${t.amount>0?'+':'-'}${money(Math.abs(t.amount))}</div><small>잔액 ${money(t.afterBalance)}</small></div></button>`}).join(''):'<div class="empty">조회조건에 해당하는 거래내역이 없습니다.</div>')}
function historySearch(){const f=historyDraft||{...historyFilter};const from=document.getElementById('historyFrom').value,to=document.getElementById('historyTo').value,min=document.getElementById('historyMin').value.replace(/,/g,'').trim(),max=document.getElementById('historyMax').value.replace(/,/g,'').trim();if(f.period==='custom'){if(!from||!to||from>to)return err('조회 시작일과 종료일을 확인해 주세요.');f.from=from;f.to=to}if((min&&!/^\d+$/.test(min))||(max&&!/^\d+$/.test(max)))return err('금액은 숫자로 입력해 주세요.');if(max!==''&&Number(min||0)>Number(max))return err('최소금액이 최대금액보다 큽니다.');f.min=min;f.max=max;f.keyword=document.getElementById('historyKeyword').value.trim();historyFilter=f;historyDraft=null;historyPanel=false;render()}
function failPassword(kind){const cert=kind==='cert',countKey=cert?'certFails':'pinFails',lockKey=cert?'certLocked':'pinLocked';state[countKey]=(state[countKey]||0)+1;if(state[countKey]>=5)state[lockKey]=true;save();err(state[lockKey]?`비밀번호 오류 5/5회. 사용이 제한되었습니다. 설정에서 연습용 인증서를 다시 발급하거나 실습을 초기화해 주세요.`:`비밀번호가 일치하지 않습니다. 입력 오류 ${state[countKey]}/5회`)}
function signupName(){const n=document.getElementById('name').value.trim();if(!n)return err('실습용 이름을 입력해 주세요.');if(n.length>20)return err('이름은 20자 이내로 입력해 주세요.');signup.name=n;go('openPin')}
function signupPin(){const p=document.getElementById('pin').value,p2=document.getElementById('pin2').value;if(!/^[0-9]{4}$/.test(p)||p!==p2)return err('일치하는 숫자 4자리 계좌 비밀번호를 입력해 주세요.');signup.pin=p;go('openSimple')}
function createAccount(){const c=document.getElementById('cert').value,c2=document.getElementById('cert2').value;if(!signup.name||!signup.pin)return go('open');if(!/^[0-9]{6}$/.test(c)||c!==c2)return err('일치하는 숫자 6자리 간편비밀번호를 입력해 주세요.');state={...empty(),name:signup.name,account:'777-'+String(Math.floor(Math.random()*1e9)).padStart(9,'0'),pin:signup.pin,cert:c,balance:5000000,transactions:demoTransactions(),loggedIn:true};signup={};save();go('home')}
function createCert(){const p=document.getElementById('cert').value,p2=document.getElementById('cert2').value;if(!/^[0-9]{6}$/.test(p)||p!==p2)return alert('일치하는 숫자 6자리 간편비밀번호를 입력하세요.');state.cert=p;state.certFails=0;state.certLocked=false;save();alert('연습용 인증서가 발급되었습니다. 이제 로그인해 보세요.');go('login')}
function login(){if(state.certLocked)return err('간편비밀번호 5회 오류로 잠겼습니다. 실습 초기화가 필요합니다.');if(document.getElementById('password').value!==state.cert)return failPassword('cert');state.certFails=0;save();state.loggedIn=true;go('home')}
function receiverNext(){const raw=document.getElementById('receiver').value.trim(),digits=raw.replace(/[\s-]/g,'');if(!draft.bank)return err('받는 은행을 선택해 주세요.');if(!/^\d{4,20}$/.test(digits))return err('계좌번호는 숫자 4~20자리로 입력해 주세요.');if(digits===state.account.replace(/\D/g,''))return err('내 계좌로는 이체할 수 없습니다.');draft.receiver=digits;draft.amount=0;draft.name=demoName(draft.bank,digits);draft.toMemo=state.name;draft.fromMemo=draft.name;go('transferReceiver')}
function amountNext(){const raw=document.getElementById('amount').value.replace(/,/g,'').trim();const n=Number(raw);if(!/^\d+$/.test(raw)||!Number.isSafeInteger(n)||n<=0)return err('이체 금액은 1원 이상의 정수로 입력해 주세요.');if(n>state.balance)return err('잔액이 부족합니다. 출금 가능: '+money(state.balance));draft.amount=n;go('transferMemo')}
function memoNext(){const name=draft.name,to=document.getElementById('toMemo').value.trim(),from=document.getElementById('fromMemo').value.trim();if(!name)return err('받는 분의 연습용 이름을 입력해 주세요.');if(!to||!from)return err('통장 표시 문구를 모두 입력해 주세요.');if([name,to,from].some(x=>x.length>20))return err('이름과 표시 문구는 20자 이내로 입력해 주세요.');draft.name=name;draft.toMemo=to;draft.fromMemo=from;draft.completed=false;go('transferConfirm')}
function executeTransfer(){if(draft.completed)return;const pin=document.getElementById('pincheck').value;if(state.pinLocked)return err('계좌 비밀번호 5회 오류로 잠겼습니다. 실습 초기화가 필요합니다.');if(pin!==state.pin)return failPassword('pin');state.pinFails=0;if(!Number.isSafeInteger(draft.amount)||draft.amount<=0||draft.amount>state.balance)return err('이체 금액이나 잔액을 다시 확인해 주세요.');draft.completed=true;draft.completedAt=now();state.balance-=draft.amount;state.transactions.unshift({label:draft.fromMemo,amount:-draft.amount,date:now(),timestamp:Date.now(),memo:draft.bank+' '+draft.receiver+' · '+draft.name});const r={bank:draft.bank,account:draft.receiver,name:draft.name};state.recent=[r,...state.recent.filter(x=>!(x.bank===r.bank&&x.account===r.account))].slice(0,12);save();go('done')}
function favoriteAdd(){const r={bank:draft.bank,account:draft.receiver,name:draft.name};state.favorites=[r,...state.favorites.filter(x=>!(x.bank===r.bank&&x.account===r.account))].slice(0,12);save();alert('자주 쓰는 계좌에 추가했습니다.')}
function logout(){state.loggedIn=false;go('login')}function resetAll(){if(confirm('계좌·인증서·거래내역·최근 계좌를 모두 삭제할까요?')){try{sessionStorage.removeItem(KEY)}catch(e){}state=empty();signup={};draft={};go('start')}}
function action(a){if(a.startsWith('go:')){bankPicker=false;go(a.slice(3));return}if(a.startsWith('tab:')){tab=a.slice(4);bankPicker=false;render();return}if(a==='toggleHistory'){historyPanel=!historyPanel;historyDraft=historyPanel?{...historyFilter}:null;render();return}if(a.startsWith('filter:')){const [,k,v]=a.split(':');historyDraft={...(historyDraft||historyFilter),[k]:v};render();return}if(a.startsWith('detail:')){detailIndex=Number(a.slice(7));go('transactionDetail');return}if(a.startsWith('removeFavorite:')){state.favorites.splice(Number(a.slice(15)),1);save();render();return}if(a==='toggleBalance'){balanceVisible=!balanceVisible;render();return}if(a==='copyAccount'){const value=state.account;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(value).then(()=>alert('계좌번호를 복사했습니다.')).catch(()=>prompt('계좌번호를 복사해 주세요.',value))}else prompt('계좌번호를 복사해 주세요.',value);return}if(a==='bankPicker'){bankPicker=true;render();return}if(a.startsWith('bank:')){draft.bank=a.slice(5);bankPicker=false;tab='direct';render();return}if(a.startsWith('pick:')){const [bank,receiver,name]=a.slice(5).split('|');draft={bank,receiver,name:name||demoName(bank,receiver),amount:0,toMemo:state.name,fromMemo:name||demoName(bank,receiver)};go('transferReceiver');return}if(a.startsWith('set:')||a==='all'){const el=document.getElementById('amount'),n=a==='all'?state.balance:Number(a.slice(4));const current=Number(draft.amount)||0;const next=a==='all'?state.balance:current+n;if(!Number.isSafeInteger(next)||next>state.balance){err('출금 가능 금액 '+money(state.balance)+'을 초과할 수 없습니다.');return}el.value=Number(next).toLocaleString('ko-KR');draft.amount=next;err('');return}const actions={signupName,signupPin,createAccount,createCert,login,receiverNext,receiverVerified,amountNext,memoNext,executeTransfer,favoriteAdd,logout,resetAll,historySearch};if(actions[a])actions[a]()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b.dataset.action)});render();
</script></body></html>
